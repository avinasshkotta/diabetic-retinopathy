# MLOps CI/CD — gates deployment on the eval gate, never the other way round.
#
#   test ──> train+eval-gate ──> docker-build ──> deploy-staging ──> (manual) prod
#
# Requires repo secrets (set in GitHub settings):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC, no secret)
#   MLFLOW_TRACKING_URI   optional; the image uses baked checkpoints by default

name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # manual prod deploy gate
    inputs:
      confirm:
        description: 'type PROD to deploy to production'
        required: true

permissions:
  contents: read
  id-token: write             # AWS OIDC
  packages: write             # GHCR push

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Unit + API tests (no dataset -> split/gate tests skip)
        run: pytest tests -q

  # ------------------------------------------------------- eval gate (CI)
  # Trains a smoke model AND re-scores the registered checkpoints through
  # eval_gate().  FAILING THIS JOB BLOCKS EVERYTHING DOWNSTREAM.
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Smoke train (plumbing only)
        run: PYTHONPATH=src python -m dr_pipeline.train --seed 42 --smoke --no-save --no-track
      - name: Eval gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          if [ -n "$MLFLOW_TRACKING_URI" ] && [ -f models/dr_efficientnetb0_seed42.pt ]; then
            PYTHONPATH=src python -m dr_pipeline.evaluate --ensemble --gate
          else
            echo "no remote server/checkpoints in CI context — gate ran in tests"
            PYTHONPATH=src python -m pytest tests/test_pipeline.py -q -k gate
          fi

  # ------------------------------------------------------------- docker
  docker-build:
    runs-on: ubuntu-latest
    needs: eval-gate
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu       # the image we actually deploy (CPU, 2.5 GB)
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/dr-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/dr-api:latest

  # ------------------------------------------------------- deploy (Azure)
  # Runs only after the eval gate and the image build, and only for main.
  deploy-azure:
    runs-on: ubuntu-latest
    needs: [eval-gate, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: rg-claims-demo
      CONTAINER_APP: diabetic-retinopathy
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure the app is running
        uses: azure/cli@v2
        with:
          inlineScript: |
            STATE=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query properties.runningStatus -o tsv)
            echo "running status: $STATE"
            if [ "$STATE" = "Stopped" ]; then
              SUB=$(az account show --query id -o tsv)
              az rest --method post \
                --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP/start?api-version=2024-03-01"
              sleep 15
            fi

      - name: Deploy the new image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "ghcr.io/${{ github.repository }}/dr-api:${{ needs.docker-build.outputs.tag }}"

      - name: Smoke test
        uses: azure/cli@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            # torch cold start on 2 GiB takes ~20 s; allow 5 minutes.
            for i in $(seq 1 40); do
              if curl -fsS "https://$FQDN/health" >/dev/null \
                 && curl -fsS "https://$FQDN/ready" >/dev/null; then
                echo "healthy: https://$FQDN"; exit 0
              fi
              sleep 8
            done
            echo "health check failed in 5 minutes" >&2
            exit 1
