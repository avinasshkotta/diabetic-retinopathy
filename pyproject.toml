[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-pipeline"
version = "0.1.0"
description = "Diabetic retinopathy grading — MLOps pipeline (train / evaluate / predict)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy",
    "pandas",
    "scikit-learn",
    "opencv-python",
    "pillow",
]

[project.optional-dependencies]
# dev = everything the test suite touches (serving tests use TestClient -> httpx,
# multipart uploads -> python-multipart); CI installs -e ".[dev]"
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "uvicorn",
    "python-multipart",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
